[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "TCAMpy"
version = "0.2.0"
authors = [
  { name="Richárd Bence Rózsa"}
]
maintainers = [
  { name="Richárd Bence Rózsa", email = "rozsaricsibence@gmail.com"}
]
description = "Cellular Automaton Model for Tumor Growth"
readme = {file = "README.md", content-type = "text/markdown"}
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.urls]
Homepage = "https://github.com/RRichardB/TCAMpy"
Documentation = "https://tcampy.readthedocs.io/en/latest/"
Repository = "https://github.com/RRichardB/TCAMpy"
Issues = "https://github.com/RRichardB/TCAMpy/issues"
Dashboard = "https://tcampy.streamlit.app/"

[tool.setuptools]
py-modules = ["TCAMpy"]
